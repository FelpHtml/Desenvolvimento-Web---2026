<div>
  <h2>Login</h2>

  <form (ngSubmit)="entrar()">

    <label>E-mail:</label>
    <input type="email" name="email" placeholder="Digite o seu email" [(ngModel)]="email" required>

    <br><br>

    <label>Senha:</label>
    <input type="password" name="senha" placeholder="Digite sua senha" [(ngModel)]="senha" required>

    <br><br>

    <button type="submit">Entrar</button>

  </form>


</div>
