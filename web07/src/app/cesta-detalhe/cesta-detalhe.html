<h2>Minha cesta</h2>
<div *ngFor="let item of cesta.itens">
  <span>{{ item.nome }}</span>
  <span>
    {{ item.quantidade }} x
    {{ item.preco | currency:'BRL' }}
  </span>
  <button (click)="remover(item.id)">X</button>
</div>
<p *ngIf="cesta.itens.length === 0">
  Sua cesta está vazia.
</p>
<h3>Total: {{ cesta.total | currency:'BRL' }}</h3>
